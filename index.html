<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>

<body>

<div class="layout">

    <!-- LEFT SIDEBAR -->
    <div class="sidebar">

        <div class="sidebar-header">
            <h2>My AI Chatbot</h2>
        </div>

        <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>

        <div id="chat-list" class="chat-list">
            <!-- Chat titles will load here dynamically -->
        </div>

        <div class="sidebar-footer">
            <button onclick="openSettings()">⚙ Settings</button>
            <button onclick="openAbout()">ℹ About</button>
        </div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="chat-container">

        <!-- CHAT HEADER -->
        <div class="chat-header">
            <span id="chat-title">  New Chat</span>
            <!-- <button onclick="renameChat()">✎ Rename</button>
            <button onclick="deleteChat()">🗑 Delete</button> -->
        </div>

        <!-- MESSAGES -->
        <div id="chat-area" class="chat-area"></div>

        <!-- INPUT AREA -->
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

</div>

<script src="/frontend/script.js"></script>
</body>
</html>
